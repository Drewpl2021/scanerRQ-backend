version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: asistencia_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: asistencia_qr
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: asistencia_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: asistencia_qr
    depends_on:
      mysql:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: asistencia_dashboard
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend